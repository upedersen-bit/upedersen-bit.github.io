<header class="topbar"><div class="topbar-in"><a class="brand" href="index.html">Two Names, Two Countries</a><a class="toc-link" href="index.html#contents">Contents</a></div></header><main class="wrap front" id="top"><header class="page-head"><p class="eyebrow">Maps</p><h1>Himmerland and its parishes</h1></header><div class="prose"><figure class="fig"><a class="zoom" href="img/full/fig02.jpg" data-full="img/full/fig02.jpg"><img src="img/web/fig02.jpg" alt="Himmerland: the places of his Danish life" loading="lazy"></a><figcaption>Map 1. The places in Niels Christian's Danish life, from his birth at Øster Hurup in 1821 to his departure from Terndrup in 1866. Red markers show where he lived or where records of his life were made; the dates are his. Satellite imagery © Google; places and dates added for this biography.</figcaption></figure>
<figure class="fig"><a class="zoom" href="img/full/fig03.jpg" data-full="img/full/fig03.jpg"><img src="img/web/fig03.jpg" alt="The parishes and districts of Aalborg Amt, with the parishes of his life shaded and an inset showing his moves of 1841–1853" loading="lazy"></a><figcaption>Map 2. The parishes (sogne) and districts (herreder) of Aalborg Amt. He was born in Als and raised in Skelund, both in Hindsted Herred. His parents' marriage is entered in the Visborg church book (Hindsted Herred), which notes that it took place in Mou church (Fleskum Herred). Before his marriage the moving lists place him in Bælum, Solbjerg and Lyngby (Hellum Herred) and, presumably, in Vive (Hindsted Herred); the inset on the right numbers his recorded moves of 1841–1853, with the arrows joining parishes rather than exact farms (see chapter 2). After his marriage he lived in Lyngby. Rold (Hindsted Herred) and Gravlev (Hornum Herred) were the homes of the two Damborg families, though no record places him in either parish. The parishes of his own life are shaded orange and the Damborg families' parishes blue; the shading, the inset and the arrows were added for this biography. The base map is unsourced; the moves are from the moving lists cited in chapter 2.</figcaption></figure></div><nav class="pager" aria-label="Chapters"><a class="prev" href="foreword.html"><span>Previous</span>Foreword</a><a class="next" href="introduction.html"><span>Next</span>Introduction</a></nav></main><footer class="site-foot"><div class="wrap"><p>Compiled by Leo Pedersen and Ulrik Damborg · Fall 2026 · Last revised 19 October 2026</p></div></footer><div class="sheet" id="sheet" hidden role="dialog" aria-label="Note"><div class="sheet-in"><button class="sheet-x" type="button" aria-label="Close note">Close</button><div class="sheet-body"></div></div></div><div class="lightbox" id="lightbox" hidden role="dialog" aria-label="Image"><button class="lb-x" type="button">Close</button><div class="lb-scroll"><img alt=""
